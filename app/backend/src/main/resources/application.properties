spring.application.name=stockSync

# Configuracao correta para o Driver JDBC do PostgreSQL
# A URL contem apenas o HOST, PORTA e NOME DO BANCO
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:stock_sync}

# Usuario e Senha sao injetados separadamente
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

api.security.token.secret=${JWT_SECRET:minha_chave_privada_do_JWT}
